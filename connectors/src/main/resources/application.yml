spring:
  application:
    name: pumpwatch-connectors
  # Each source keeps its own settings file so connectors can be added independently.
  config:
    import: "optional:classpath:alpaca.yml,optional:classpath:bluesky.yml,optional:classpath:reddit.yml,optional:classpath:alpaca-news.yml,optional:classpath:sec.yml,optional:classpath:finnhub.yml,optional:classpath:rss.yml"
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/pumpwatch}
    username: ${POSTGRES_USER:pumpwatch}
    password: ${POSTGRES_PASSWORD:pumpwatch}
  flyway:
    # connectors and replay share one database, so each keeps its own migration history
    table: flyway_history_connectors
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

pumpwatch:
  # tickers every connector cares about; Alpaca streams them, social connectors filter posts by them
  watchlist: ${WATCHLIST:GME,AMC,SNDL}
  kafka:
    # Producer is always idempotent with acks=all. max-in-flight must be <= 5.
    retries: 10
    delivery-timeout: 2m
    max-block: 10s
    max-in-flight: 5
    buffer-capacity: 10000      # per connector; full buffer = stop fetching + health DOWN
    batch-size: 500
    initial-backoff: 100ms
    max-backoff: 10s
    broker-down-after: 60s      # health DOWN once sends fail continuously this long
    max-fetch-age: 2m           # health DOWN when the last successful fetch is older
  sources:
    # requests-per-minute: set BELOW the source's published limit, never at it.
    sec:
      requests-per-minute: 300  # SEC publishes 10 req/s (600/min)
      enabled: ${SEC_ENABLED:false} # off until terms verified (docs/data-sources.md)
      requires-user-agent: true # when enabled, startup fails if SEC_USER_AGENT is empty
      user-agent: ${SEC_USER_AGENT:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-components: always
