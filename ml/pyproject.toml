[project]
name = "pumpml"
version = "0.1.0"
description = "Offline training and evaluation for the Pumpwatch pump score and volatility forecast"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.6",
  "scikit-learn==1.9.1",
  "lightgbm==4.7.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools]
packages = ["pumpml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
