spring:
  application:
    name: pumpwatch-replay
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/pumpwatch}
    username: ${POSTGRES_USER:pumpwatch}
    password: ${POSTGRES_PASSWORD:pumpwatch}
  flyway:
    table: flyway_history_replay
    baseline-on-migrate: true
