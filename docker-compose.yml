name: pumpwatch

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    environment:
      TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-6}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in raw-posts ticks raw-news raw-filings ingest-dlq mentions features scores flags source-health; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic "$$t" --partitions "$${TOPIC_PARTITIONS}" --replication-factor 1
        done

  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: pumpwatch
      POSTGRES_USER: ${POSTGRES_USER:-pumpwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pumpwatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d pumpwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  connectors:
    profiles: ["apps"]
    build:
      context: .
      args:
        MODULE: connectors
        PORT: "8080"
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/pumpwatch
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  replay:
    profiles: ["apps"]
    build:
      context: .
      args:
        MODULE: replay
        PORT: "8081"
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/pumpwatch
      REPLAY_PORT: "8081"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  pipeline:
    profiles: ["apps"]
    build:
      context: .
      args:
        MODULE: pipeline
        PORT: "8082"
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      PIPELINE_PORT: "8082"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8082:8082"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  api:
    profiles: ["apps"]
    build:
      context: .
      args:
        MODULE: api
        PORT: "8083"
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/pumpwatch
      API_PORT: "8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8083:8083"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  pgdata:
  kafkadata:
