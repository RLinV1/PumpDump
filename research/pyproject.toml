[project]
name = "stock-research-assistant"
version = "0.2.0"
description = "Stock lookup and a Gemini research assistant (MCP tools, RAG, evals) for Pumpwatch"
requires-python = ">=3.13,<3.14"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "mcp>=1.2,<2",
    "google-genai>=1.0",
    "chromadb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_risk", "api", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
