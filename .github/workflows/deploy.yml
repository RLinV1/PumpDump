name: Deploy to AWS (Elastic Beanstalk)

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure EB application-versions S3 bucket exists
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="elasticbeanstalk-${AWS_REGION}-${ACCOUNT_ID}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "S3 bucket s3://$BUCKET already exists."
          else
            echo "S3 bucket s3://$BUCKET not found — creating it."
            if [ "$AWS_REGION" = "us-east-1" ]; then
              # us-east-1 rejects a LocationConstraint; every other region requires one.
              aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            echo "Created s3://$BUCKET."
          fi
          # New buckets default to Object Ownership "Bucket owner enforced",
          # which disables ACLs. The EB CLI uploads app versions with an ACL,
          # so re-enable them (idempotent — safe to run even if already set).
          aws s3api put-bucket-ownership-controls --bucket "$BUCKET" \
            --ownership-controls Rules=[{ObjectOwnership=BucketOwnerPreferred}]

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install EB CLI
        run: pip install awsebcli --quiet

      - name: Swap in AWS compose file
        run: |
          cp docker-compose.yml docker-compose.dev.yml
          cp docker-compose.aws.yml docker-compose.yml

      - name: Initialize EB app
        run: |
          eb init "${{ vars.EB_APP_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --platform "Docker"

      - name: Fetch secrets from AWS Secrets Manager
        id: secrets
        run: |
          _parse() {
            python3 -c "
          import sys, json
          s = sys.stdin.read().strip()
          try:
            d = json.loads(s)
            print(list(d.values())[0])
          except Exception:
            print(s)
          "
          }
          ANTHROPIC_KEY=$(aws secretsmanager get-secret-value \
            --secret-id plutus/anthropic-api-key \
            --query SecretString --output text | _parse)
          POSTGRES_PASS=$(aws secretsmanager get-secret-value \
            --secret-id plutus/postgres-password \
            --query SecretString --output text | _parse)
          CLERK_JWKS=""
          CLERK_PK=""
          CLERK_SECRET=""
          TURNSTILE_KEY=""
          if aws secretsmanager describe-secret --secret-id plutus/clerk-jwks-url 2>/dev/null; then
            CLERK_JWKS=$(aws secretsmanager get-secret-value \
              --secret-id plutus/clerk-jwks-url \
              --query SecretString --output text | _parse)
          fi
          if aws secretsmanager describe-secret --secret-id plutus/clerk-secret-key 2>/dev/null; then
            CLERK_SECRET=$(aws secretsmanager get-secret-value \
              --secret-id plutus/clerk-secret-key \
              --query SecretString --output text | _parse)
          fi
          if aws secretsmanager describe-secret --secret-id plutus/clerk-publishable-key 2>/dev/null; then
            CLERK_PK=$(aws secretsmanager get-secret-value \
              --secret-id plutus/clerk-publishable-key \
              --query SecretString --output text | _parse)
          fi
          if aws secretsmanager describe-secret --secret-id plutus/turnstile-site-key 2>/dev/null; then
            TURNSTILE_KEY=$(aws secretsmanager get-secret-value \
              --secret-id plutus/turnstile-site-key \
              --query SecretString --output text | _parse)
          fi
          # Billing / Stripe (all optional — quota still enforced without them).
          STRIPE_KEY=""
          STRIPE_WH=""
          STRIPE_PRO=""
          STRIPE_PRO_MAX=""
          UNLIMITED_IDS=""
          if aws secretsmanager describe-secret --secret-id plutus/stripe-secret-key 2>/dev/null; then
            STRIPE_KEY=$(aws secretsmanager get-secret-value \
              --secret-id plutus/stripe-secret-key --query SecretString --output text | _parse)
          fi
          if aws secretsmanager describe-secret --secret-id plutus/stripe-webhook-secret 2>/dev/null; then
            STRIPE_WH=$(aws secretsmanager get-secret-value \
              --secret-id plutus/stripe-webhook-secret --query SecretString --output text | _parse)
          fi
          if aws secretsmanager describe-secret --secret-id plutus/stripe-price-pro 2>/dev/null; then
            STRIPE_PRO=$(aws secretsmanager get-secret-value \
              --secret-id plutus/stripe-price-pro --query SecretString --output text | _parse)
          fi
          if aws secretsmanager describe-secret --secret-id plutus/stripe-price-pro-max 2>/dev/null; then
            STRIPE_PRO_MAX=$(aws secretsmanager get-secret-value \
              --secret-id plutus/stripe-price-pro-max --query SecretString --output text | _parse)
          fi
          if aws secretsmanager describe-secret --secret-id plutus/unlimited-user-ids 2>/dev/null; then
            UNLIMITED_IDS=$(aws secretsmanager get-secret-value \
              --secret-id plutus/unlimited-user-ids --query SecretString --output text | _parse)
          fi
          ADMIN_KEY=""
          if aws secretsmanager describe-secret --secret-id plutus/admin-api-key 2>/dev/null; then
            ADMIN_KEY=$(aws secretsmanager get-secret-value \
              --secret-id plutus/admin-api-key --query SecretString --output text | _parse)
          fi

          # Mask secret values in logs, then hand them to later steps via
          # outputs (fetched ONCE, here — before any container ever boots).
          for v in "$ANTHROPIC_KEY" "$POSTGRES_PASS" "$CLERK_JWKS" "$CLERK_PK" "$CLERK_SECRET" "$TURNSTILE_KEY" \
                   "$STRIPE_KEY" "$STRIPE_WH" "$STRIPE_PRO" "$STRIPE_PRO_MAX" "$UNLIMITED_IDS" "$ADMIN_KEY"; do
            if [ -n "$v" ]; then
              echo "::add-mask::$v"
            fi
          done
          {
            echo "anthropic_key=$ANTHROPIC_KEY"
            echo "postgres_pass=$POSTGRES_PASS"
            echo "clerk_jwks=$CLERK_JWKS"
            echo "clerk_pk=$CLERK_PK"
            echo "clerk_secret=$CLERK_SECRET"
            echo "turnstile_key=$TURNSTILE_KEY"
            echo "stripe_key=$STRIPE_KEY"
            echo "stripe_wh=$STRIPE_WH"
            echo "stripe_pro=$STRIPE_PRO"
            echo "stripe_pro_max=$STRIPE_PRO_MAX"
            echo "unlimited_ids=$UNLIMITED_IDS"
            echo "admin_key=$ADMIN_KEY"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure environment exists (recreate if terminated)
        run: |
          ENV="${{ vars.EB_ENV_NAME }}"
          if eb status "$ENV" >/dev/null 2>&1; then
            echo "Environment $ENV exists — will deploy to it."
            eb use "$ENV"
          else
            echo "Environment $ENV not found (terminated?) — creating it."
            # Pass secrets at creation time (--envvars), not after. Postgres
            # bakes POSTGRES_PASSWORD into its persistent volume on its FIRST
            # boot and never re-reads it — if the env is created without
            # secrets and 'eb setenv' only runs afterward (the old order),
            # Postgres initializes with docker-compose.aws.yml's fallback
            # password while the API ends up with the real one, and every
            # DB-touching request 500s forever until the volume is reset.
            eb create "$ENV" \
              --instance-type t3.medium \
              --single \
              --platform "Docker running on 64bit Amazon Linux 2023" \
              --region "${{ env.AWS_REGION }}" \
              --envvars "ANTHROPIC_API_KEY=${{ steps.secrets.outputs.anthropic_key }},POSTGRES_PASSWORD=${{ steps.secrets.outputs.postgres_pass }},CLERK_JWKS_URL=${{ steps.secrets.outputs.clerk_jwks }},CLERK_SECRET_KEY=${{ steps.secrets.outputs.clerk_secret }},VITE_CLERK_PUBLISHABLE_KEY=${{ steps.secrets.outputs.clerk_pk }},VITE_TURNSTILE_SITE_KEY=${{ steps.secrets.outputs.turnstile_key }},STRIPE_SECRET_KEY=${{ steps.secrets.outputs.stripe_key }},STRIPE_WEBHOOK_SECRET=${{ steps.secrets.outputs.stripe_wh }},STRIPE_PRICE_PRO=${{ steps.secrets.outputs.stripe_pro }},STRIPE_PRICE_PRO_MAX=${{ steps.secrets.outputs.stripe_pro_max }},UNLIMITED_USER_IDS=${{ steps.secrets.outputs.unlimited_ids }},ADMIN_API_KEY=${{ steps.secrets.outputs.admin_key }}"
          fi

      - name: Wake environment if paused
        run: |
          # If the env was taken offline with scripts/eb-stop.sh (instance
          # stopped + ASG suspended), bring it back BEFORE setenv/deploy, which
          # can't reach a stopped instance. Idempotent: no-op if already running.
          bash scripts/eb-start.sh "${{ vars.EB_ENV_NAME }}" "${{ env.AWS_REGION }}" \
            || echo "eb-start.sh found nothing to wake (fresh/terminated env) — continuing."

      - name: Sync secrets to EB env vars
        run: |
          # Reuses the values fetched once above (id: secrets) — also covers
          # the "environment already existed" branch, where --envvars on
          # create was never run, and picks up any mid-flight secret rotation.
          eb setenv \
            ANTHROPIC_API_KEY="${{ steps.secrets.outputs.anthropic_key }}" \
            POSTGRES_PASSWORD="${{ steps.secrets.outputs.postgres_pass }}" \
            CLERK_JWKS_URL="${{ steps.secrets.outputs.clerk_jwks }}" \
            CLERK_SECRET_KEY="${{ steps.secrets.outputs.clerk_secret }}" \
            VITE_CLERK_PUBLISHABLE_KEY="${{ steps.secrets.outputs.clerk_pk }}" \
            VITE_TURNSTILE_SITE_KEY="${{ steps.secrets.outputs.turnstile_key }}" \
            STRIPE_SECRET_KEY="${{ steps.secrets.outputs.stripe_key }}" \
            STRIPE_WEBHOOK_SECRET="${{ steps.secrets.outputs.stripe_wh }}" \
            STRIPE_PRICE_PRO="${{ steps.secrets.outputs.stripe_pro }}" \
            STRIPE_PRICE_PRO_MAX="${{ steps.secrets.outputs.stripe_pro_max }}" \
            UNLIMITED_USER_IDS="${{ steps.secrets.outputs.unlimited_ids }}" \
            ADMIN_API_KEY="${{ steps.secrets.outputs.admin_key }}"

      - name: Wait for environment to be ready
        run: |
          for i in {1..20}; do
            STATUS=$(eb status | grep "Status:" | awk '{print $2}')
            echo "Environment status: $STATUS"
            if [ "$STATUS" = "Ready" ]; then break; fi
            sleep 30
          done

      - name: Deploy
        run: |
          eb deploy \
            --timeout 20 \
            --label "gh-${{ github.sha }}"

      - name: Restore dev compose
        if: always()
        run: |
          cp docker-compose.dev.yml docker-compose.yml
          rm -f docker-compose.dev.yml

      - name: Summary
        run: |
          echo "### Deployed to Elastic Beanstalk" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA**: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **App**: \`${{ vars.EB_APP_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Env**: \`${{ vars.EB_ENV_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
