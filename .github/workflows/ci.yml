name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
      - name: Backend dependency licenses
        run: bash scripts/license-gate.sh maven

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sentiment-models
          key: text-models-${{ hashFiles('web/text-models.mjs', 'web/package-lock.json') }}
      - run: node scripts/fetch-sentiment-model.mjs
        env:
          SENTIMENT_MODEL_DIR: ${{ runner.temp }}/sentiment-models
      - run: node scripts/check-sentiment.mjs --offline
        env:
          SENTIMENT_MODEL_DIR: ${{ runner.temp }}/sentiment-models
      - name: Web dependency licenses
        run: bash ../scripts/license-gate.sh npm

  python:
    name: Python
    runs-on: ubuntu-latest
    env:
      USE_MOCK_DATA: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ml/requirements-dev.txt
            ml/requirements.txt
            research/pyproject.toml
      - run: pip install -r ml/requirements-dev.txt -e "./research[dev]"
      - name: Offline ML tests
        run: python -m pytest
        working-directory: ml
      - name: Research service lint
        run: ruff check .
        working-directory: research
      - name: Research service tests
        run: python -m pytest
        working-directory: research
      - name: Build knowledge library
        run: python -m portfolio_risk.rag.ingest
        working-directory: research
      - name: Assistant evaluation gate
        run: python -m evals.run_evals --agent mock
        working-directory: research
      - name: Python dependency licenses
        run: |
          bash scripts/license-gate.sh selftest
          bash scripts/license-gate.sh cards
          bash scripts/license-gate.sh python
          bash scripts/license-gate.sh research

  # No AWS credentials: format and syntax checks only, with no backend.
  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform -chdir=infra/aws fmt -check -recursive
      - run: terraform -chdir=infra/aws init -backend=false -input=false
      - run: terraform -chdir=infra/aws validate
