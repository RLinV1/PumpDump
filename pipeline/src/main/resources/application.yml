spring:
  application:
    name: pumpwatch-pipeline
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    streams:
      application-id: pumpwatch-pipeline
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        auto.offset.reset: earliest
        # one output per window per commit interval: the 15 s emit cadence
        commit.interval.ms: 15000
        statestore.cache.max.bytes: 10485760
        processing.guarantee: exactly_once_v2
        # single-broker local stack; raise on a real cluster
        replication.factor: ${STREAMS_REPLICATION:1}
        state.dir: ${STREAMS_STATE_DIR:/tmp/pumpwatch-streams}
pipeline:
  watchlist: ${WATCHLIST:GME,AMC,SNDL}
  scoring-window-minutes: 5
  baseline-mentions-per-minute: 1.0
  flag-level: 60
  cooldown: PT30M
  reflag-margin: 10
  catalyst-lookback: PT1H
server:
  port: ${PIPELINE_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
